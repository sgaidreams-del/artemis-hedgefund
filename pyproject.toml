[project]
name = "artemis"
version = "0.1.0"
description = "Artemis — AI-assisted paper-trading research system for US equities"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "click>=8.1",
    # Database
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",   # faster for large frames
    # Market data + broker
    "alpaca-py>=0.30",
    "yfinance>=0.2.40",
    "lxml>=5.0",  # required by yfinance's earnings-calendar scraper
    "polygon-api-client>=1.14",
    "fredapi>=0.5",
    # News / social
    "feedparser>=6.0",
    "praw>=7.7",
    "sec-edgar-downloader>=5.0",
    # Indicators / TA
    "pandas-ta>=0.3.14b0",
    # Stats / ML
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    # Backtesting
    "vectorbt>=0.26",
    # Portfolio optimization
    "pyportfolioopt>=1.5",
    # Sentiment (FinBERT loads via transformers)
    "transformers>=4.42",
    "torch>=2.3",   # CPU build is fine
    # Reinforcement learning (FinRL agent)
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    # Hyperparameter search (AutoResearch weight optimizer)
    "optuna>=3.6",
    # Scheduling
    "celery>=5.4",
    "apscheduler>=3.10",
    # Monitoring / dashboard (React + FastAPI — see dashboard/)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "plotly>=5.22",
    "python-telegram-bot>=21.0",
    # HTTP / API
    "httpx>=0.27",
    "requests>=2.32",
    # OpenAI-compatible SDK — used to call DeepSeek
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.25",
    "jupyter>=1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
